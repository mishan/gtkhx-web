<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}

{% seo %}
  </head>

  <body>

    <header>
      <div class="container">
        <a id="a-title" href="{{ '/' | relative_url }}">
          <h1>{{ site.title | default: site.github.repository_name }}</h1>
        </a>
        <h2>{{ site.description | default: site.github.project_tagline }}</h2>

        <section id="downloads">
          {% if site.show_downloads %}
            <a href="{{ site.github.zip_url }}" class="btn">Download as .zip</a>
            <a href="{{ site.github.tar_url }}" class="btn">Download as .tar.gz</a>
          {% endif %}
          <a href="{{ site.github.repository_url }}/releases/latest" class="btn">Download</a>
          <a href="https://ko-fi.com/mishandev" class="btn" id="support-link">Support</a>
          <a href="{{ site.github.repository_url }}" class="btn btn-github"><span class="icon"></span>View on GitHub</a>
        </section>
      </div>
    </header>

    <div class="container">
      <section id="main_content">
        {{ content }}
      </section>
    </div>

    <style>
      /* Wide screens get Ko-fi's floating button instead of this link. */
      @media (min-width: 800px) { #downloads #support-link { display: none; } }
    </style>
    <script>
      // The floating button sits over the page, which a phone has no room
      // for: load it only where there is some.
      if (window.matchMedia('(min-width: 800px)').matches) {
        var kofi = document.createElement('script');
        kofi.src = 'https://storage.ko-fi.com/cdn/scripts/overlay-widget.js';
        kofi.onload = function () {
          kofiWidgetOverlay.draw('mishandev', {
            'type': 'floating-chat',
            'floating-chat.donateButton.text': 'Support me',
            'floating-chat.donateButton.background-color': '#ff38b8',
            'floating-chat.donateButton.text-color': '#fff'
          });
        };
        document.body.appendChild(kofi);
      }
    </script>

  </body>
</html>
